# این فایل را در مسیر .github/workflows/rci_alert.yml در ریپازیتوری خودتان قرار دهید

name: RCI Telegram Alert

on:
  schedule:
    # هر ساعت، دقیقه ۲ بعد از بسته‌شدن کندل ساعتی (به وقت UTC)
    - cron: "2 * * * *"
  workflow_dispatch: {}  # امکان اجرای دستی از تب Actions برای تست

jobs:
  check-rci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run RCI check
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python rci_telegram_alert.py
